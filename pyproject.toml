[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "disk-explorer-cleaner"
version = "0.2.0"
description = "A performance-oriented Windows disk explorer with a Rust scanning engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.70,<2"]

[project.optional-dependencies]
windows = ["send2trash>=1.8"]
screenshots = ["resvg-py>=0.5,<1", "Pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
disk-explorer = "disk_explorer.__main__:main"

[tool.maturin]
manifest-path = "rust/disk_scan/Cargo.toml"
python-source = "src"
module-name = "disk_explorer._rust_scanner"
include = ["src/disk_explorer/ui/styles/app.tcss"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
